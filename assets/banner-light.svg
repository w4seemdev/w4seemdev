<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Waseem: full-stack developer building AI-powered web products</title>
  <desc id="bannerDesc">Wordmark banner reading WASEEM with a violet to cyan gradient underline, the line full-stack developer / ai-powered web products, and the handle @w4seemdev.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .sweep { animation: sweep 16s ease-in-out infinite alternate; }
      .caret { animation: blink 6s ease-in-out infinite; }
      @keyframes sweep {
        from { transform: translateX(0); }
        to { transform: translateX(-320px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.12; }
      }
    }
  </style>
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0d1117" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="underlineClip">
      <rect x="96" y="190" width="464" height="7" rx="3.5"/>
    </clipPath>
  </defs>

  <!-- background: matches the GitHub canvas, with a faint dot grid texture -->
  <rect width="1280" height="320" fill="#ffffff"/>
  <rect width="1280" height="320" fill="url(#dotGrid)"/>

  <!-- decorative code tokens, low opacity, asymmetric -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" fill="#0d1117" aria-hidden="true">
    <text x="960" y="230" font-size="150" opacity="0.05">{ }</text>
    <text x="884" y="288" font-size="26" opacity="0.09">&lt;/&gt;</text>
  </g>

  <!-- handle chip, top right -->
  <rect x="1028" y="44" width="156" height="36" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1106" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#57606a">@w4seemdev</text>

  <!-- wordmark -->
  <text x="96" y="172" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="12" fill="#14181f">WASEEM</text>

  <!-- gradient underline sweep -->
  <g clip-path="url(#underlineClip)">
    <rect class="sweep" x="96" y="190" width="784" height="7" fill="url(#accent)"/>
  </g>

  <!-- mono line, prompt style -->
  <text x="96" y="246" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="22" fill="#57606a"><tspan fill="#7c3aed">$</tspan> full-stack developer / ai-powered web products <tspan class="caret" fill="#0891b2">&#9612;</tspan></text>
</svg>
