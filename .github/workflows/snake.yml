# Generates the contribution-graph snake animation with Platane/snk and publishes
# the SVGs to the "output" branch of this repo. Runs daily, on push to main, and
# on manual dispatch. Uses only the default GITHUB_TOKEN: no secrets to configure.
# The README embeds the light and dark SVGs from the output branch via
# raw.githubusercontent.com/w4seemdev/w4seemdev/output/... URLs.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: w4seemdev
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
