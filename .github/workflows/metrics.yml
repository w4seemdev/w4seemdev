name: Metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: w4seemdev
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Amman
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          plugin_lines: yes

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # PageSpeed rings — uncomment when your AI Pulse site is live.
          # Needs a free API key from https://developers.google.com/speed/docs/insights/v5/get-started
          # saved as a PAGESPEED_TOKEN repository secret.
          # plugin_pagespeed: yes
          # plugin_pagespeed_detailed: yes
          # plugin_pagespeed_url: https://your-site-url.com
          # plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
