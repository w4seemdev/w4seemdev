# Requires a METRICS_TOKEN repository secret: a classic GitHub PAT with public-repo
# read scope (Settings > Secrets and variables > Actions). Without it, the daily cron
# fails silently. After adding the secret, trigger the first run manually via
# workflow_dispatch — it commits github-metrics.svg to the repo. The README does not
# reference that SVG; only embed it after a successful run has committed the file.
name: Metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: w4seemdev
          template: classic
          base: header, repositories
          config_timezone: Asia/Amman
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # PageSpeed rings — uncomment when your AI Pulse site is live.
          # Needs a free API key from https://developers.google.com/speed/docs/insights/v5/get-started
          # saved as a PAGESPEED_TOKEN repository secret.
          # plugin_pagespeed: yes
          # plugin_pagespeed_detailed: yes
          # plugin_pagespeed_url: https://your-site-url.com
          # plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
